<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Bottle | 每日一款酒</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="#hero">DAILY BOTTLE</a>
    <div class="nav-links"><a href="#collection">酒款</a><span>/</span><a href="#about">风味</a><span>/</span><a href="https://github.com/kelvinschen/daily-bottle-page">GitHub</a></div>
  </nav>
  <section id="hero" class="panel hero">
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="eyebrow">ONE DRINK A DAY · BAUHAUS EDITION</p>
        <h1>干杯！<br><span>每日一款酒</span></h1>
        <p>50 款来自世界各地的名酒，以包豪斯海报、滚动切换和动态图表重新呈现。</p>
      </div>
      <div class="clink" aria-label="cheers animation"><div class="glass left"><span></span></div><div class="glass right"><span></span></div><i></i></div>
    </div>
    <div class="scroll-hint">SCROLL TO EXPLORE ↓</div>
  </section>
  <main id="collection"></main>
  <section id="about" class="panel footer">
    <h2>ONE BOTTLE A DAY</h2>
    <p>资料覆盖威士忌、伏特加、金酒、朗姆、龙舌兰、白兰地、利口酒等类别。每张海报由前端 SVG/CSS 动态生成，适合 GitHub Pages 静态部署。</p>
  </section>
</body>
</html>
